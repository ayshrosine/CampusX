zerops:
  - setup: backend
    build:
      base: python@3.11
      buildCommands:
        - pip install -r backend/requirements.txt
      deployFiles:
        - backend
      addToRunPrepare:
        - backend/requirements.txt
    run:
      base: python@3.11
      os: ubuntu
      prepareCommands:
        - pip install -r backend/requirements.txt
      ports:
        - port: 8001
          httpSupport: true
      envVariables:
        DB_NAME: assetflow_campus
        VAPID_SUBJECT: mailto:admin@assetflow.edu
        CORS_ORIGINS: ${frontend_zeropsSubdomain}
        GOOGLE_CLIENT_ID: 303299367578-drvv2qdvav274mud7cmidnm5q7bas5i0.apps.googleusercontent.com
        GOOGLE_CLIENT_SECRET: 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
      start: cd backend && python3 -m uvicorn server:app --host 0.0.0.0 --port 8001

  - setup: frontend
    build:
      base: nodejs@20
      envVariables:
        REACT_APP_BACKEND_URL: ${backend_zeropsSubdomain}
        REACT_APP_GOOGLE_CLIENT_ID: 303299367578-drvv2qdvav274mud7cmidnm5q7bas5i0.apps.googleusercontent.com
      buildCommands:
        - cd frontend && yarn install && yarn build
      deployFiles:
        - frontend/build/~
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      start: npx serve -s . -l 3000