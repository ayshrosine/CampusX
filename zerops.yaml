zerops:
  - setup: backend
    build:
      base: python@3.11
      buildCommands:
        - pip install -r backend/requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.11
      os: ubuntu
      ports:
        - port: 8001
          httpSupport: true
      envVariables:
        DB_NAME: assetflow_campus
        VAPID_SUBJECT: mailto:admin@assetflow.edu
        CORS_ORIGINS: ${frontend_zeropsSubdomain}
      start: cd backend && uvicorn server:app --host 0.0.0.0 --port 8001

  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && yarn install && yarn build
      deployFiles:
        - frontend/build
    run:
      base: nodejs@20
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        REACT_APP_BACKEND_URL: ${backend_zeropsSubdomain}
      start: npx serve -s . -l 3000